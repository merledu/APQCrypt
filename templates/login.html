{% extends "auth_base.html" %}
{% block title %}Sign in{% endblock %}
{% block card %}
<h2>Sign in</h2>
<p class="page-sub">Use the account issued to you by the super admin.</p>
{% if error %}<div class="form-error" role="alert">{{ error }}</div>{% endif %}
<form method="post" action="{{ url_for('login') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <input type="hidden" name="next" value="{{ next }}">
  <div class="field"><label for="username">Username</label>
    <input class="ctl" id="username" name="username" autocomplete="username" required autofocus></div>
  <div class="field"><label for="password">Password</label>
    <input class="ctl" id="password" name="password" type="password" autocomplete="current-password" required></div>
  <button class="btn navy" type="submit" style="width:100%;justify-content:center">Sign in</button>
</form>
{% endblock %}
